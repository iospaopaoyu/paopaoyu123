name: Build Deb
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt update && sudo apt install -y dpkg-dev make
      - name: Build deb
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: output-deb
          path: '*.deb'
